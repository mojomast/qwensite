<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SOLAR SYSTEM — an orbital model</title>
    <meta name="description" content="An interactive WebGL model of our solar system with eight planets, moons, rings, asteroid belts and a deep stellar backdrop." />
    <style>
      :root {
        --fg: #cfe0ff;
        --dim: #55648a;
        --accent: #8fb7ff;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #000;
      }
      #scene {
        position: fixed;
        inset: 0;
      }
      canvas {
        display: block;
      }
      #hud {
        position: fixed;
        inset: 0;
        pointer-events: none;
        font-family: ui-monospace, 'SF Mono', 'Cascadia Code', Menlo, Consolas, monospace;
        color: var(--fg);
        z-index: 5;
      }
      .brand {
        position: absolute;
        top: 24px;
        left: 28px;
        letter-spacing: 0.35em;
        font-size: 13px;
        text-transform: uppercase;
      }
      .brand b {
        color: var(--accent);
        font-weight: 600;
      }
      .brand small {
        display: block;
        margin-top: 6px;
        letter-spacing: 0.14em;
        font-size: 10px;
        color: var(--dim);
        text-transform: none;
      }
      .stats {
        position: absolute;
        bottom: 22px;
        left: 28px;
        font-size: 11px;
        color: var(--dim);
        line-height: 1.8;
      }
      .stats span {
        color: var(--fg);
      }
      .hints {
        position: absolute;
        bottom: 22px;
        right: 28px;
        font-size: 11px;
        color: var(--dim);
        text-align: right;
        line-height: 1.8;
      }
      .model-note {
        position: absolute;
        top: 24px;
        right: 28px;
        max-width: 260px;
        color: var(--dim);
        font-size: 10px;
        line-height: 1.6;
        letter-spacing: 0.08em;
        text-align: right;
        text-transform: uppercase;
      }
      #labels {
        position: fixed;
        inset: 0;
        overflow: hidden;
      }
      .celestial-label {
        position: absolute;
        top: 0;
        left: 0;
        padding: 3px 6px;
        color: #c7d8f4;
        background: rgb(3 8 20 / 55%);
        border: 1px solid rgb(126 158 206 / 18%);
        border-radius: 2px;
        font-size: 9px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        white-space: nowrap;
        transition: opacity 0.2s ease;
      }
      #veil {
        position: fixed;
        inset: 0;
        background: #000;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: opacity 0.9s ease;
        z-index: 10;
      }
      #veil.fade {
        opacity: 0;
        pointer-events: none;
      }
      #veil p {
        letter-spacing: 0.45em;
        font-size: 11px;
        color: var(--dim);
        animation: pulse 1.6s ease-in-out infinite;
        font-family: ui-monospace, Menlo, Consolas, monospace;
      }
      @keyframes pulse {
        50% {
          opacity: 0.3;
        }
      }
    </style>
  </head>
  <body>
    <div id="scene"></div>
    <div id="hud">
      <div class="brand">
        <b>S</b>olar System
        <small>WebGL2 &middot; eight planets &middot; orbital model</small>
      </div>
      <div class="model-note">Distances and body sizes compressed for an all-system view</div>
      <div class="stats">
        <span id="fps">&ndash;</span> fps &middot; <span id="count">&ndash;</span> particles &middot;
        <span id="mode">&ndash;</span>
      </div>
      <div class="hints">
        drag &mdash; orbit &middot; scroll &mdash; zoom &middot; space &mdash; auto-orbit<br />
        r &mdash; reset camera &middot; h &mdash; hide ui
      </div>
      <div id="labels"></div>
    </div>
    <div id="veil">
      <p>ASSEMBLING ORBITS</p>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
